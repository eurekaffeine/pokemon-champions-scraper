# Scraper configuration
scraper:
  user_agent: "PocketGallery-Scraper/1.0 (+https://github.com/user/pocket-gallery)"
  request_delay_ms: 1000  # Be polite - 1 second between requests
  max_retries: 3
  timeout_seconds: 30

sources:
  pikalytics:
    enabled: true
    base_url: "https://pikalytics.com/pokedex/champions"
  opgg:
    enabled: false  # Disabled: HTML scraping unreliable, distorts Pikalytics data via weighted merge
    base_url: "https://op.gg/pokemon-champions"
  game8:
    enabled: false  # TODO: implement
    base_url: "https://game8.co/games/Pokemon-Champions"

output:
  format: json
  directory: ./output
  per_pokemon_files: true
  compress: false  # gzip for large files

schedule:
  cron: "0 2 * * *"  # Daily at 2 AM UTC

# Telegram notifications (optional)
telegram:
  enabled: false
  bot_token: ""  # Set via environment: TELEGRAM_BOT_TOKEN
  chat_id: ""    # Set via environment: TELEGRAM_CHAT_ID

# Logging
logging:
  level: INFO
  json_format: false  # Set to true for production/structured logging
